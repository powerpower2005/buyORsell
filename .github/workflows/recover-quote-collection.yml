name: Recover quote collection
run-name: ${{ github.event_name == 'workflow_run' && format('Recover scheduled Fetch Quote run {0}', github.event.workflow_run.id) || 'Recover quote collection manually' }}

on:
  workflow_run:
    workflows: ["Fetch Quote"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  recover:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.event == 'schedule' &&
         contains(fromJSON('["failure", "timed_out"]'), github.event.workflow_run.conclusion) &&
         github.event.workflow_run.run_attempt == 1))
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/fetch-quote.yml
    with:
      batch_refresh: true
    secrets:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
