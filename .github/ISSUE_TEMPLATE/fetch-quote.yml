name: Fetch Quote Data
description: Request OHLCV fetch for a ticker
labels:
  - fetch-quote
body:
  - type: input
    id: ticker
    attributes:
      label: Ticker
      description: "Format NVDA:NASDAQ or BTC-USD"
      placeholder: "NVDA:NASDAQ"
    validations:
      required: true
  - type: input
    id: timeframe
    attributes:
      label: Timeframe
      description: "1d only (primary). 1w/1mo are derived from 1d after fetch — do not request minute/hour bars."
      placeholder: "1d"
    validations:
      required: true
