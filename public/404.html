<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>개미브레인롯</title>
    <!--
      SPA GitHub Pages deep-link fallback (rafgraph/spa-github-pages style).
      GitHub Pages serves this 404.html for unknown paths under /buyORsell/,
      then redirects to index.html?/… so client-side routing can restore the path.
      pathSegmentsToKeep = 1 keeps the /buyORsell/ base segment.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // /buyORsell/
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search
            ? "&" + l.search.slice(1).replace(/&/g, "~and~")
            : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
